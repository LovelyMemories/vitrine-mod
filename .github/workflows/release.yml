# Every push to main updates one release PR (version.txt and CHANGELOG.md from the feat:/fix:
# commits since the last release). Merging it tags vX.Y.Z and makes the GitHub Release. The second job
# builds the tweak on every push, with the Xcode build-ipa.yml uses, so a change that compiles only with a
# newer SDK than that is caught before a release is cut from it. Nothing is attached: a .deb injected by hand
# misses the app changes the redesign needs, so people build the full IPA (README). No IPA is built here.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  build:
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
    steps:
      - uses: actions/checkout@v5

      - name: Cache the tools
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-tools-${{ hashFiles('.github/workflows/release.yml') }}

      # One step, as in build-ipa.yml: the echoes still name what it is on, and Xcode needs no setup here
      # because macos-latest already has the current stable selected. The executable bit is restored here
      # because a checkout made from a Windows machine loses it and tweak/Makefile calls scripts/ directly.
      # Theos is a shallow clone: nothing in the build reads its history.
      - name: Install tools
        timeout-minutes: 25
        run: |
          echo "==> xcode: $(xcodebuild -version | head -1)"
          echo "==> scripts"
          chmod +x scripts/*.sh scripts/*.py
          echo "==> brew"
          brew install make dpkg ldid
          echo "==> theos"
          git clone --depth 1 --recurse-submodules --shallow-submodules --jobs 8 https://github.com/theos/theos.git "$THEOS"

      # The flag table is read out of Spotify's binary (make flags), so it comes from a secret
      # instead of an IPA: gzip -9c tweak/Sources/Shared/Flags/SGFlagList.m | base64 | gh secret set SG_FLAG_LIST
      - name: Flag table
        env:
          SG_FLAG_LIST: ${{ secrets.SG_FLAG_LIST }}
        run: |
          [ -n "$SG_FLAG_LIST" ] || { echo "::error::the SG_FLAG_LIST secret is not set"; exit 1; }
          echo "$SG_FLAG_LIST" | base64 -d | gunzip > tweak/Sources/Shared/Flags/SGFlagList.m

      - name: Build
        run: env -u MAKELEVEL gmake -C tweak clean package
