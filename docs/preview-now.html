<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitrine — страницы, как они теперь</title>
<style>
  :root { --card:#1c1c1e; --hair:rgba(255,255,255,.10); --grey:rgba(255,255,255,.45); --accent:#ff375f; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; }
  body {
    background:radial-gradient(circle at 20% 0%, #191a22, #0b0b0e 60%, #08080a);
    color:#fff; min-height:100vh; padding:28px; display:flex; gap:40px; justify-content:center; align-items:flex-start;
    font:400 14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  }
  .phone { position:relative; width:390px; height:812px; flex:0 0 auto; border-radius:54px; border:8px solid #1b1b20;
    background:#000; box-shadow:0 40px 120px rgba(0,0,0,.85), 0 0 0 1px #2b2b33; overflow:hidden; }
  .screen { position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; padding-bottom:28px; }
  .screen::-webkit-scrollbar { width:3px; } .screen::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); }
  .status { display:flex; justify-content:space-between; padding:15px 26px 2px; font-size:13px; font-weight:600; }
  .nav { display:flex; align-items:center; gap:12px; padding:4px 16px 12px; }
  .back { width:38px; height:38px; border-radius:50%; background:rgba(255,255,255,.12); display:grid; place-items:center; font-size:16px; }
  .nav h1 { flex:1; text-align:center; font-size:17px; font-weight:700; margin:0; }

  .card { background:var(--card); border-radius:22px; margin:0 16px 18px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:13px 16px; min-height:46px; border-top:1px solid var(--hair); font-size:16px; }
  .row:first-child { border-top:0; }
  .row .grow { flex:1; min-width:0; }
  .row .sub { font-size:11.5px; color:var(--grey); margin-top:2px; }
  .row .value { color:var(--grey); font-size:15px; }
  .chev { color:rgba(255,255,255,.3); }
  .sw { width:50px; height:30px; border-radius:15px; background:var(--accent); position:relative; flex:0 0 auto; }
  .sw.off { background:#39393d; }
  .sw::after { content:""; position:absolute; top:2px; left:2px; width:26px; height:26px; border-radius:50%; background:#fff; }
  .sw:not(.off)::after { transform:translateX(20px); }

  /* Albums: обложка во всю карточку */
  .hero { position:relative; margin:0 16px 18px; height:330px; border-radius:22px; overflow:hidden;
    background:radial-gradient(circle at 50% 42%, #ff5a2b 0%, #b8341f 38%, #2b2f36 78%, #14181d 100%); }
  .hero .shade { position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.45) 45%, rgba(0,0,0,.05)); }
  .hero .words { position:absolute; left:16px; right:16px; bottom:88px; text-align:center; }
  .hero .t { font-size:26px; font-weight:700; letter-spacing:.2px; }
  .hero .a { font-size:16px; color:rgba(255,255,255,.85); margin-top:6px; }
  .hero .k { font-size:13px; color:rgba(255,255,255,.6); margin-top:4px; }
  .hero .buttons { position:absolute; left:0; right:0; bottom:20px; display:flex; justify-content:center; gap:8px; }
  .hero .b { width:48px; height:48px; border-radius:24px; background:rgba(255,255,255,.22); display:grid; place-items:center; font-size:16px; }
  .hero .b.play { width:170px; background:#fff; color:#000; font-weight:600; font-size:17px; }

  /* Player: карточки фонов с превью */
  .bgs { display:flex; gap:10px; margin:0 16px 14px; overflow-x:auto; padding-bottom:4px; }
  .bgs::-webkit-scrollbar { height:0; }
  .bg { width:104px; flex:0 0 auto; }
  .bg .pic { height:110px; border-radius:12px; position:relative; overflow:hidden;
    background:radial-gradient(circle at 30% 25%, #ff4fa3, transparent 55%), radial-gradient(circle at 75% 35%, #31c7f5, transparent 50%),
               radial-gradient(circle at 50% 85%, #8a4bff, transparent 60%), #241038; }
  .bg .n { font-size:11px; color:rgba(255,255,255,.6); text-align:center; margin-top:6px; }
  .bg.on .pic { outline:2px solid var(--accent); outline-offset:3px; }
  .bg.on .n { color:#fff; }
  .pic .wave { position:absolute; left:0; right:0; bottom:0; height:46px;
    background:linear-gradient(to top, rgba(255,255,255,.30), transparent); border-radius:0 0 12px 12px; }

  /* Appearance */
  .accents { display:flex; justify-content:space-between; margin:0 16px 18px; padding:17px 14px; background:var(--card); border-radius:20px; }
  .accents i { width:30px; height:30px; border-radius:50%; }
  .accents i.on { box-shadow:0 0 0 2px #fff; }
  .icons { display:flex; gap:12px; margin:0 16px 18px; padding:15px 16px; background:var(--card); border-radius:20px; overflow-x:auto; }
  .icons::-webkit-scrollbar { height:0; }
  .cell { width:58px; flex:0 0 auto; text-align:center; }
  .cell .sq { width:58px; height:58px; border-radius:14px; background:linear-gradient(160deg,#1db954,#0d7a35); display:grid; place-items:center; font-size:24px; }
  .cell.g .sq { background:linear-gradient(160deg,#34343a,#1d1d21); }
  .cell.b .sq { background:linear-gradient(160deg,#2c6fed,#12327a); }
  .cell.p .sq { background:linear-gradient(160deg,#ff4fa3,#8a1155); }
  .cell.on .sq { outline:2px solid var(--accent); outline-offset:3px; }
  .cell .n { font-size:9.5px; color:rgba(255,255,255,.55); margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Home */
  .home { margin:0 16px 18px; height:300px; border-radius:22px; padding:8px; background:var(--card); }
  .inner { position:relative; height:100%; border-radius:18px; padding:10px 16px 12px;
    background:linear-gradient(145deg,#2547c8,#12246b); display:flex; flex-direction:column; height:100%; }
  .inner .h { display:flex; justify-content:space-between; align-items:flex-start; }
  .inner .title { font-size:34px; font-weight:700; letter-spacing:-.7px; }
  .inner .pill { width:96px; height:34px; border-radius:17px; background:rgba(255,255,255,.22); }
  .picks { display:flex; gap:10px; margin-top:12px; overflow:hidden; }
  .picks .c { width:78px; flex:0 0 auto; }
  .picks .cov { height:78px; border-radius:8px; background:rgba(255,255,255,.55); }
  .picks .c:first-child .cov { background:linear-gradient(150deg,#3b5bd8,#1e2a78); }
  .picks .t { font-size:11px; font-weight:600; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .picks .s { font-size:10px; color:rgba(255,255,255,.6); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wide { margin-top:auto; height:96px; border-radius:12px; background:linear-gradient(135deg,#6b2fa8,#1b1440); position:relative; }
  .wide .t { position:absolute; left:12px; bottom:10px; font-size:14px; font-weight:700; }

  .printed-demo { display:flex; gap:12px; margin:0 16px 16px; }
  .printed-demo .half { flex:1; text-align:center; }
  .printed-demo .cov { height:118px; border-radius:12px;
    background:radial-gradient(circle at 30% 25%, #ff4fa3, transparent 55%), radial-gradient(circle at 75% 35%, #31c7f5, transparent 50%),
               radial-gradient(circle at 50% 85%, #8a4bff, transparent 60%), #241038; }
  .printed-demo .printed { filter:url(#sgPosterize) contrast(1.45) saturate(.75); position:relative; }
  .printed-demo .printed::after { content:""; position:absolute; inset:0; border-radius:12px; opacity:.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='1' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>"); }
  .printed-demo .cap { font-size:10.5px; color:rgba(255,255,255,.55); margin-top:6px; line-height:1.35; }
  .panel { width:340px; flex:0 0 auto; }
  .panel h2 { margin:0 0 4px; font-size:19px; }
  .panel .lede { margin:0 0 18px; font-size:12.5px; color:rgba(255,255,255,.45); line-height:1.5; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; }
  .tabs button { padding:8px 11px; border-radius:10px; cursor:pointer; border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05); color:rgba(255,255,255,.62); font:600 12px/1 -apple-system,sans-serif; }
  .tabs button[aria-pressed="true"] { background:rgba(255,255,255,.16); color:#fff; }
  h3 { margin:16px 0 7px; font:600 10.5px/1.2 -apple-system,sans-serif; letter-spacing:.8px; text-transform:uppercase; color:rgba(255,255,255,.36); }
  ul { margin:0; padding-left:15px; font-size:12.5px; line-height:1.6; color:rgba(255,255,255,.66); }
  li { margin-bottom:5px; } li b { color:#fff; }
  code { font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace; color:rgba(255,255,255,.5); }
  .warn { color:hsl(38 92% 66%); }
  @media (max-width:1000px){ body{flex-direction:column;align-items:center;padding:16px;gap:22px;} .panel{width:390px;max-width:100%;} }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="sgPosterize"><feComponentTransfer>
  <feFuncR type="discrete" tableValues="0 .25 .5 .75 1"/><feFuncG type="discrete" tableValues="0 .25 .5 .75 1"/><feFuncB type="discrete" tableValues="0 .25 .5 .75 1"/>
</feComponentTransfer></filter></svg>

<div class="phone"><div class="screen" id="screen"></div></div>

<aside class="panel">
  <h2>Vitrine — как теперь</h2>
  <p class="lede">Четыре страницы мода после сегодняшних правок. Всё это лежит в <code>origin/main</code> на <code>9dcb416</code>.</p>
  <div class="tabs" role="group">
    <button data-page="albums" aria-pressed="true">Albums</button>
    <button data-page="player" aria-pressed="false">Player</button>
    <button data-page="appearance" aria-pressed="false">Appearance</button>
    <button data-page="home" aria-pressed="false">Home</button>
  </div>
  <div id="notes"></div>
</aside>

<script>
const nav = (title) => `
  <div class="status"><span>17:57</span><span>▮▮▮ 82</span></div>
  <div class="nav"><div class="back">‹</div><h1>${title}</h1></div>`;

const pages = {
  albums: () => nav("Albums") + `
    <div class="hero">
      <div class="shade"></div>
      <div class="words">
        <div class="t">LOOM</div>
        <div class="a">Imagine Dragons</div>
        <div class="k">Album · 2024</div>
      </div>
      <div class="buttons"><div class="b">⇄</div><div class="b play">▶ Play</div><div class="b">+</div></div>
    </div>
    <div class="card">
      <div class="row"><div class="grow">Artist picture<div class="sub">The artist's photo before their name</div></div><div class="sw"></div></div>
      <div class="row"><div class="grow">Animated covers<div class="sub">About 5 MB each</div></div><div class="sw"></div></div>
      <div class="row"><div class="grow">Download in Low Data Mode</div><div class="sw"></div></div>
    </div>
    <div class="card">
      <div class="row"><div class="grow">Album artist on every track<div class="sub">The artist under a track when it is the album's own</div></div><div class="sw off"></div></div>
    </div>
    <div class="card">
      <div class="row"><div class="grow">More by the artist</div><div class="sw"></div></div>
      <div class="row"><div class="grow">Related music videos</div><div class="sw"></div></div>
      <div class="row"><div class="grow">Concerts</div><div class="sw"></div></div>
      <div class="row"><div class="grow">Merch</div><div class="sw"></div></div>
      <div class="row"><div class="grow">You might also like</div><div class="sw"></div></div>
      <div class="row"><div class="grow">Everything else</div><div class="sw off"></div></div>
    </div>`,

  player: () => nav("Player") + `
    <div class="bgs">
      ${[["Still",""],["Colors",""],["Fluid","on"],["Animated",""],["Visualizer","wave"],["Aurora",""],["Black",""],["Auto",""]]
        .map(([n, cls]) => `<div class="bg ${cls === 'on' ? 'on' : ''}"><div class="pic">${cls === 'wave' ? '<div class="wave"></div>' : ''}</div><div class="n">${n}</div></div>`).join("")}
    </div>
    <div class="printed-demo">
      <div class="half"><div class="cov"></div><div class="cap">Animated, у трека есть клип</div></div>
      <div class="half"><div class="cov printed"></div><div class="cap">Animated, клипа нет — обложка «напечатана»</div></div>
    </div>
    <div class="card">
      <div class="row"><div class="grow">Sources</div><div class="value">Spotify Canvas, Apple Music</div><div class="chev">›</div></div>
    </div>
    <div class="card">
      <div class="row"><div class="grow">Adjust<div class="sub">Fluid's speed, warp, blur, saturation, brightness and grain</div></div><div class="chev">›</div></div>
    </div>
    <div class="card">
      <div class="row"><div class="grow">Video button<div class="sub">Switch to video from the cover</div></div><div class="sw"></div></div>
    </div>
    <div class="card">
      <div class="row"><div class="grow">Volume slider<div class="sub">Under the controls for this iPhone, or the speaker's</div></div><div class="sw"></div></div>
      <div class="row"><div class="grow">Follow the cover</div><div class="sw"></div></div>
      <div class="row"><div class="grow">Only the music</div><div class="sw off"></div></div>
    </div>`,

  appearance: () => nav("Appearance") + `
    <div class="icons">
      ${[["on","◉","Liquid"],["b","◍","Arcs"],["g","◉","Arcs Light"],["p","◕","Blue"],["g","◉","Blue Inverse"]]
        .map(([c,g,n]) => `<div class="cell ${c}"><div class="sq">${g}</div><div class="n">${n}</div></div>`).join("")}
    </div>
    <div class="accents">
      ${["#1DB954","#FA2D48","#37F200","#0A84FF","#BF5AF2","#FF375F","#FF9F0A","#64D2FF"]
        .map((c,i) => `<i class="${i===2?'on':''}" style="background:${c}"></i>`).join("")}
    </div>
    <div class="card">
      <div class="row"><div class="grow">Accent from the cover<div class="sub">Follows the cover of the song playing</div></div><div class="sw off"></div></div>
      <div class="row"><div class="grow">Accent color</div><div class="value">#37F200</div><div class="chev">›</div></div>
      <div class="row"><div class="grow">All icons</div><div class="value">24</div><div class="chev">›</div></div>
    </div>`,

  home: () => nav("Home") + `
    <div class="home"><div class="inner">
      <div class="h"><div class="title">Home</div><div class="pill"></div></div>
      <div class="picks">
        ${[["Two picks","Made for you"],["For you","Your mix"],["Lately","Played a lot"],["Bright","New"]]
          .map(([t,s]) => `<div class="c"><div class="cov"></div><div class="t">${t}</div><div class="s">${s}</div></div>`).join("")}
      </div>
      <div class="wide"><div class="t">Your week</div></div>
    </div></div>
    <div class="card">
      <div class="row"><div class="grow">Home look<div class="sub">Top picks, tinted pills, the title's glass pill</div></div><div class="sw"></div></div>
      <div class="row"><div class="grow">Shortcuts</div><div class="sw off"></div></div>
      <div class="row"><div class="grow">DJ</div><div class="sw off"></div></div>
      <div class="row"><div class="grow">Podcasts and audiobooks</div><div class="sw off"></div></div>
    </div>`,
};

const NOTES = {
  albums: ["<b>Обложка во всю карточку</b>, название, артист и <code>Album · 2024</code> поверх неё, кнопки <b>shuffle · ▶ Play · +</b> — как на их странице.",
           "<b>Artist picture</b> — новый переключатель (коммит <code>c46b559</code>): фото артиста берётся из Spotify'вской <code>ParentRow</code>, ключ читается при каждой раскладке, так что работает без перезапуска.",
           "Порядок секций и названия — их: Artist picture → Animated covers → Low Data → Album artist on every track → секции под треками."],
  player: ["<b>Animated</b> без клипа печатает обложку: Core Image дизерит и срезает градации (<code>5f9f63a</code>).", "<b>Фоны карточками с превью обложки</b> вместо строки из восьми названий: у каждого свой вид (Visualizer — двумя гребнями, Aurora — занавесями, Black — чёрным).",
           "<b>Sources</b> показывается при любом фоне и говорит <code>Spotify Canvas, Apple Music</code>.",
           "<b>Adjust</b> — шесть чисел Fluid отдельной страницей, <b>Buttons</b> и <b>Volume slider</b> — как у них.",
           "На самой карточке при Fluid работает <b>шейдерное поле</b>: оно вынесено из анимируемой вьюхи (это был источник двух падений) и рисуется слоем над таблицей, вполсилы."],
  appearance: ["<b>24 иконки</b> с нормальными подписями — «Arcs Light», «Blue Inverse».",
               "Полоса акцентов: фиксированные цвета плюс <b>недавно выбранные</b>, кольцо на текущем.",
               "<b>Accent from the cover</b> — акцент следует за обложкой играющего трека, при выключении возвращается выбранный цвет."],
  home: ["Карточка показывает <b>настоящий фид Главной</b>: картинки и подписи видимых ячеек, в их порядке.",
         "Карточки артистов больше не круги — скругление приводится к радиусу обложки.",
         "Shortcuts, DJ и Podcasts выключены по умолчанию: Home открывается полками и Top picks."],
};

const screen = document.getElementById("screen");
const notes = document.getElementById("notes");
function show(page) {
  screen.innerHTML = pages[page]();
  screen.scrollTop = 0;
  notes.innerHTML = `<h3>Что здесь сделано</h3><ul>${NOTES[page].map(t => `<li>${t}</li>`).join("")}</ul>`;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.page === page)));
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.page)));
show((location.hash || "#albums").slice(1));
</script>
</body>
</html>
