name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]

env:
  THEOS: ${{ github.workspace }}/theos
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build:
    runs-on: macos-latest
    # Without this a stuck brew or curl holds the job until GitHub's six-hour limit: ten minutes of silence and
    # then a failure with nothing in the log says where it stopped.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Homebrew's bottles and pip's wheels carry over between runs; the key follows this file, so changing the
      # tools asks for a fresh cache once and then keeps it.
      - name: Cache the tools
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            ~/.cache/pip
          key: ${{ runner.os }}-tools-${{ hashFiles('.github/workflows/build-ipa.yml') }}

      # One step, with its own echoes, rather than four: the log still says which part it was on, and the job no
      # longer pays for a step transition between each. The executable bit is on this list because a checkout made
      # from a Windows machine loses it, and make release starts ./scripts/pipeline.sh and calls the rest directly.
      #
      # Theos is a shallow clone: the full recursive one is minutes of the job and nothing here reads its history.
      # Xcode needs no setup, macos-latest already has the current stable selected.
      - name: Install tools
        timeout-minutes: 25
        run: |
          echo "==> xcode: $(xcodebuild -version | head -1)"
          echo "==> scripts"
          chmod +x scripts/*.sh scripts/*.py
          echo "==> brew"
          brew install make dpkg ldid
          echo "==> pyzule"
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git
          echo "==> theos"
          git clone --depth 1 --recurse-submodules --shallow-submodules --jobs 8 https://github.com/theos/theos.git "$THEOS"

      # The URL goes through the environment, not through the step's command line, so the log never shows it and
      # the masking action this workflow used to run is not needed.
      - name: Download IPA
        timeout-minutes: 15
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          mkdir -p ipa
          curl -fSL --retry 3 --retry-delay 5 --connect-timeout 30 --max-time 900 "$IPA_URL" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      - name: Version
        id: version
        run: echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Build the tweak into the IPA
        timeout-minutes: 30
        run: make release

      # The IPA is already compressed: storing it as it is uploads in seconds instead of re-deflating 120 MB.
      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: vitrine-${{ steps.version.outputs.version }}
          path: out/*.ipa
          if-no-files-found: error
          compression-level: 1

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="vitrine-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
